{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.autoscaling.enabled }}
{{- if and $root.Values.kafka.dev.enabled (ne $name "orchestrator") (gt (int $svc.autoscaling.maxReplicas) (int $root.Values.kafka.dev.partitions)) }}
{{- fail (printf "services.%s.autoscaling.maxReplicas (%d) exceeds kafka.dev.partitions (%d): extra consumers would sit idle" $name (int $svc.autoscaling.maxReplicas) (int $root.Values.kafka.dev.partitions)) }}
{{- end }}
---
# Requires metrics-server (CPU utilization is measured against resource requests).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "opsbrain.labels" $root | nindent 4 }}
    {{- include "opsbrain.selectorLabels" (dict "name" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # Avoid flapping after short LLM-driven CPU bursts.
      stabilizationWindowSeconds: 300
{{- end }}
{{- end }}
