{{- $svc := index .Values.services "infra-agent" -}}
{{- if and $svc.enabled $svc.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc.serviceAccount.name }}
  labels:
    {{- include "opsbrain.labels" . | nindent 4 }}
  {{- with $svc.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Read-only: exactly what the Infra Agent's Kubernetes tools call. No secrets,
# no write verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" .Release.Namespace $svc.serviceAccount.name }}
  labels:
    {{- include "opsbrain.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" .Release.Namespace $svc.serviceAccount.name }}
  labels:
    {{- include "opsbrain.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" .Release.Namespace $svc.serviceAccount.name }}
subjects:
  - kind: ServiceAccount
    name: {{ $svc.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
