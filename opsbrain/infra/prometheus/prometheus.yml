# Scrape config for local dev.
# Agents (orchestrator/rag/monitoring/infra/code) don't expose /metrics yet
# (Stage 2 work) — those targets show as "down" until each service adds a
# metrics endpoint. The demo-kube-state-metrics job + rule feed the
# Alertmanager demo pipeline (Rifat's monitoring-agent work).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: opsbrain-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:8000"]
        labels: {service: orchestrator}

  - job_name: opsbrain-rag-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-agent:8001"]
        labels: {service: rag-agent}

  - job_name: opsbrain-monitoring-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["monitoring-agent:8002"]
        labels: {service: monitoring-agent}

  - job_name: opsbrain-infra-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["infra-agent:8003"]
        labels: {service: infra-agent}

  - job_name: opsbrain-code-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["code-agent:8004"]
        labels: {service: code-agent}

  - job_name: demo-kube-state-metrics
    static_configs:
      - targets: ["pod-metrics:9100"]
