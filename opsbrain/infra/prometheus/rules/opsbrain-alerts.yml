groups:
  - name: opsbrain-availability
    rules:
      - alert: OpsBrainServiceUnavailable
        expr: up{job=~"opsbrain-.*"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "OpsBrain service {{ $labels.service }} is unavailable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for more than 2 minutes."
          runbook_url: "docs/observability.md#service-unavailable"
      - alert: OpsBrainPrometheusScrapeFailure
        expr: increase(prometheus_target_scrapes_exceeded_sample_limit_total[10m]) > 0 or increase(prometheus_target_scrapes_sample_duplicate_timestamp_total[10m]) > 0
        for: 5m
        labels: {severity: warning, service: prometheus}
        annotations:
          summary: "Prometheus is rejecting scraped samples"
          description: "A target exceeded its sample limit or returned duplicate timestamps in the last 10 minutes."
          runbook_url: "docs/observability.md#prometheus-scrape-failure"
  - name: opsbrain-application
    rules:
      - alert: OpsBrainHighHttpErrorRate
        expr: sum by (service) (rate(opsbrain_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum by (service) (rate(opsbrain_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "High HTTP error rate for {{ $labels.service }}"
          description: "More than 5% of requests have returned 5xx for 10 minutes."
          runbook_url: "docs/observability.md#high-http-error-rate"
      - alert: OpsBrainHighRequestLatency
        expr: histogram_quantile(0.95, sum by (service, le) (rate(opsbrain_http_request_duration_seconds_bucket{service!~"rag-agent|orchestrator"}[10m]))) > 2 or histogram_quantile(0.95, sum by (service, le) (rate(opsbrain_http_request_duration_seconds_bucket{service="rag-agent"}[10m]))) > 30 or histogram_quantile(0.95, sum by (service, le) (rate(opsbrain_http_request_duration_seconds_bucket{service="orchestrator"}[10m]))) > 45
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "High p95 request latency for {{ $labels.service }}"
          description: "HTTP p95 exceeded its service threshold for 10 minutes: RAG 30s, orchestrator 45s, other services 2s."
          runbook_url: "docs/observability.md#high-latency"
      - alert: OpsBrainRepeatedAgentFailures
        expr: sum by (agent) (increase(opsbrain_agent_failures_total{error_code=~"timeout|unavailable|invalid_response"}[10m])) >= 3
        for: 5m
        labels: {severity: critical, service: orchestrator}
        annotations:
          summary: "Repeated {{ $labels.agent }} agent failures"
          description: "At least 3 timeout, unavailable or invalid-response failures occurred in 10 minutes. Input/configuration errors are excluded; inspect HTTP 5xx separately."
          runbook_url: "docs/observability.md#repeated-agent-failures"
      - alert: OpsBrainHighAgentLatency
        expr: histogram_quantile(0.95, sum by (agent, le) (rate(opsbrain_agent_execution_duration_seconds_bucket{agent!="rag"}[10m]))) > 20 or histogram_quantile(0.95, sum by (agent, le) (rate(opsbrain_agent_execution_duration_seconds_bucket{agent="rag"}[10m]))) > 45
        for: 10m
        labels: {severity: warning, service: orchestrator}
        annotations:
          summary: "High p95 execution latency for {{ $labels.agent }} agent"
          description: "Agent execution p95 exceeded its threshold for 10 minutes: RAG 45s, other agents 20s."
          runbook_url: "docs/observability.md#high-latency"
