# Infra Agent — Kubernetes Deployment + Service

apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-agent
  namespace: opsbrain
  labels:
    app: infra-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-agent
  template:
    metadata:
      labels:
        app: infra-agent
    spec:
      containers:
        - name: infra-agent
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/opsbrain-infra:latest
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: AWS_REGION
              value: "us-east-1"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: infra-agent
  namespace: opsbrain
  labels:
    app: infra-agent
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8003"
spec:
  selector:
    app: infra-agent
  ports:
    - name: http
      port: 8003
      targetPort: 8003
  type: ClusterIP
