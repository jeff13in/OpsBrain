# Monitoring Agent — Kubernetes Deployment + Service

apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-agent
  namespace: opsbrain
  labels:
    app: monitoring-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-agent
  template:
    metadata:
      labels:
        app: monitoring-agent
    spec:
      containers:
        - name: monitoring-agent
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/opsbrain-monitoring:latest
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: AGENT_TRANSPORT
              value: "kafka"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"
            - name: PROMETHEUS_BASE_URL
              value: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"
            - name: GRAFANA_BASE_URL
              value: "http://kube-prometheus-stack-grafana.observability.svc.cluster.local"
            - name: ALERTMANAGER_BASE_URL
              value: "http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-agent
  namespace: opsbrain
  labels:
    app: monitoring-agent
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8002"
spec:
  selector:
    app: monitoring-agent
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  type: ClusterIP
